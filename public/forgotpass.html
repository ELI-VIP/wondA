<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Recovery</title>
  <link rel="stylesheet" href="styles.css">
 
</head>
<body>

  <div class="container">    
      <h1>Password Recovery</h1>
      
      <div class="login-option">
       <button onclick="toggleForm('company_pr')">Recover as Company</button>
       <button onclick="toggleForm('individual_name_c')">Recover as Individual</button>
      </div> 

      <form id = "company_pr"  class="form-container">
        <label for="company_ID">Company ID</label>
        <input type="text" id="company_ID" name="company_ID"><br>
        <label for="cuser_ID">User ID</label>
        <input type="text" id="cuser_ID" name="cuser_ID"><br>
        <label for="cemail">Account Email</label>
        <input type="email" id="cemail" name="cemail" >
        <br><br>
        <button type="submit">Reset Password</button>
      </form>     

      <form id="individual_name_c" class="form-container">
        <label for="Email">Account Email</label>
        <input type="email" id="email" name="email" > <br>
        <label for="number">User ID</label>
        <input type="text" id="user_id" name="user_id">
        <br><br>
        <button type="submit">Reset Password</button>
      </form>

      <br>

      
  </div>

  <script type="module" src="/js/script.js"></script>
</body>

</html>
